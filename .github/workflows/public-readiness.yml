name: Public readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libdbus-1-3 libegl1 libgl1 libglib2.0-0 libxkbcommon0
      - name: Install project and test dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run complete test suite
        run: python -m pytest -q

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-web.txt

  container:
    name: Production container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build --file Dockerfile.web --tag hjksell-web:ci .
      - name: Validate HTTPS proxy configuration
        run: |
          docker run --rm \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --env PUBLIC_DOMAIN=example.com \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Start production app with isolated test storage
        run: |
          set -eu
          docker volume create hjksell-ci-data
          token_key="$(python3 -c 'import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
          docker run --detach --name hjksell-ci \
            --publish 127.0.0.1:8765:8765 \
            --mount source=hjksell-ci-data,target=/data \
            --env HJKSELL_MINI_APP_BOT_TOKEN=12345:ci-only-token \
            --env "HJKSELL_TOKEN_ENCRYPTION_KEY=$token_key" \
            hjksell-web:ci
          trap 'docker logs hjksell-ci || true; docker rm --force hjksell-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8765/api/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8765/api/portfolios)" = 401
