<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HJKsell Web</title>
  <link rel="stylesheet" href="/styles.css?v=smoked-dragon-motion-10">
</head>
<body>
  <header class="page-header">
    <h1>HJKsell Catalog</h1>
    <section class="toolbar" aria-label="Настройки каталога">
      <div class="portfolio-control">
        <label for="portfolioSelect">ПОРТФЕЛЬ</label>
        <div class="portfolio-select-row">
          <div class="glass-select" id="portfolioPicker">
            <button id="portfolioPickerButton" class="glass-select-button" type="button" aria-expanded="false" aria-haspopup="listbox">
              <span id="portfolioPickerLabel">Портфель</span>
            </button>
            <div id="portfolioPickerMenu" class="glass-select-menu" role="listbox" hidden></div>
          </div>
          <select id="portfolioSelect" class="sr-only" aria-label="Портфель"></select>
          <button id="renamePortfolioButton" class="icon-button" type="button" title="Изменить название портфеля" aria-label="Изменить название портфеля">✎</button>
          <button id="createPortfolioButton" class="icon-button" type="button" title="Добавить портфель" aria-label="Добавить портфель">+</button>
        </div>
        <form id="renamePortfolioForm" class="rename-form" hidden>
          <input id="portfolioNameInput" name="name" maxlength="24" required aria-label="Новое название портфеля">
          <button type="submit">Сохранить</button>
          <button id="cancelRenameButton" type="button">Отмена</button>
        </form>
        <form id="createPortfolioForm" class="rename-form" hidden>
          <input id="newPortfolioNameInput" name="name" maxlength="24" required placeholder="Название портфеля" aria-label="Название нового портфеля">
          <button type="submit">Добавить</button>
          <button id="cancelCreatePortfolioButton" type="button">Отмена</button>
        </form>
      </div>
      <form id="rateForm" class="rate-form">
        <span class="rate-label">PLN → BYN</span>
        <input id="rateInput" name="rate" inputmode="decimal" required aria-label="Курс PLN к BYN">
        <button type="submit">Сохранить курс</button>
      </form>
    </section>
    <div class="header-actions">
      <button id="deletePortfolioButton" class="danger-action" type="button" title="Удалить текущий портфель" aria-label="Удалить текущий портфель">Удалить портфель</button>
      <button id="analyticsButton" type="button" aria-pressed="false">Аналитика</button>
      <button id="addItemButton" class="primary-action" type="button" aria-expanded="false" aria-controls="newItemPanel">Добавить вещь</button>
      <button id="telegramButton" type="button" aria-expanded="false" aria-controls="telegramPanel">Telegram</button>
    </div>
  </header>

  <main>
    <section id="catalogView">
    <div class="catalog-controls">
      <nav id="filters" class="filters" aria-label="Фильтры">
        <button type="button" data-filter="all" aria-pressed="true">ВСЕ</button>
        <button type="button" data-filter="stock" aria-pressed="false">В НАЛИЧИИ</button>
        <button type="button" data-filter="sold" aria-pressed="false">ПРОДАНО</button>
        <button type="button" data-filter="no_revenue" aria-pressed="false">БЕЗ ВЫРУЧКИ</button>
      </nav>
      <section id="collapsedSummary" class="collapsed-summary" aria-label="Краткая статистика текущего месяца"></section>
    </div>

    <section id="telegramPanel" class="telegram-panel" aria-label="Настройки Telegram" hidden>
      <div class="panel-heading">
        <h2>Telegram</h2>
        <span id="telegramStatus" class="telegram-status">Не настроен</span>
      </div>
      <form id="telegramForm">
        <label>Bot Token
          <input id="telegramToken" name="token" type="password" autocomplete="off" placeholder="введите токен бота">
        </label>
        <label>ID канала
          <input id="telegramChannel" name="channel_id" inputmode="numeric" placeholder="например, -1001234567890">
        </label>
        <button id="telegramValidateButton" type="button">Проверить токен</button>
        <button class="primary-action" type="submit">Сохранить и запустить</button>
        <button id="telegramClearButton" class="danger" type="button">Отключить и очистить</button>
      </form>
      <p id="telegramHint" class="telegram-hint">Публикация должна содержать одно фото и цену в PLN.</p>
      <div id="discoveredChannels" class="discovered-channels" hidden></div>
    </section>

    <section id="newItemPanel" class="new-item" hidden>
      <h2>Добавить вещь</h2>
      <form id="itemForm">
        <label>Цена покупки, PLN
          <input name="purchase_price_pln" inputmode="decimal" required>
        </label>
        <label>Дата покупки
          <input name="purchase_date" type="date" required>
        </label>
        <label>Фото для dev-базы
          <span class="file-picker">
            <span data-file-name>Добавить фото</span>
            <input name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp">
          </span>
        </label>
        <button type="submit">Добавить</button>
      </form>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
    <section id="catalog" aria-label="Каталог по месяцам"></section>
    </section>

    <section id="analyticsView" class="analytics-view" aria-label="Аналитика" hidden>
      <header class="analytics-heading">
        <div>
          <h2>Аналитика</h2>
          <p id="analyticsPeriodRange"></p>
        </div>
        <label>Период
          <div class="glass-select" id="analyticsPicker">
            <button id="analyticsPickerButton" class="glass-select-button" type="button" aria-expanded="false" aria-haspopup="listbox">
              <span id="analyticsPickerLabel">Текущий месяц</span>
            </button>
            <div id="analyticsPickerMenu" class="glass-select-menu" role="listbox" hidden></div>
          </div>
          <select id="analyticsPeriod" class="sr-only">
            <option value="current_month">Текущий месяц</option>
            <option value="previous_month">Предыдущий месяц</option>
            <option value="3_months">3 месяца</option>
            <option value="6_months">6 месяцев</option>
            <option value="current_year">Текущий год</option>
            <option value="all_time">Всё время</option>
          </select>
        </label>
      </header>
      <div id="analyticsSections" class="analytics-sections"></div>
    </section>
  </main>

  <dialog id="photoViewer" class="photo-viewer" aria-label="Просмотр фото вещи">
    <img id="photoViewerImage" alt="Фото вещи в полном размере">
  </dialog>

  <script src="/app.js?v=smoked-dragon-motion-10" defer></script>
</body>
</html>
